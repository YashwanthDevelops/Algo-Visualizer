name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run algorithm regression tests
        run: npm test

      - name: Install browser smoke dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build hero React component
        run: |
          npm run typecheck
          npm run build:glyph

      - name: Run browser smoke check
        run: npm run smoke:browser

      - name: Run question visualizer browser smoke check
        run: npm run smoke:question

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html *.css README.md TASKS.md package.json _site/
          cp -R js assets docs reports _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

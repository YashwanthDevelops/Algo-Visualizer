<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#171615" />
    <meta
      name="description"
      content="An interactive playground for comparing search, optimization, game AI, and constraint solving algorithms."
    />
    <title>Search & Optimization Playground</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="hallmark.css" />
    <link rel="stylesheet" href="ui-enhancements.css" />
    <link rel="stylesheet" href="question-visualizer.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#dashboard"
        ><span class="brand-mark">S<span>+</span>O</span
        ><span class="brand-name"
          >Search & Optimization<small>Algorithm workbench</small></span
        ></a
      >
      <p class="nav-label">Workspace</p>
      <nav aria-label="Labs" id="navigation"></nav>
      <div class="sidebar-foot">
        <div class="storage-note">Saved in this browser</div>
        <p>Fundamentals of Artificial Intelligence</p>
        <a id="project-docs" href="README.md" target="_blank" rel="noopener"
          >Project documentation</a
        >
      </div>
    </aside>
    <main id="main">
      <header class="topbar">
        <div class="breadcrumb-group">
          <span>Workspace</span><span aria-hidden="true">/</span
          ><span id="breadcrumb">Overview</span>
        </div>
        <span class="local-badge">Local storage</span>
      </header>
      <div id="app"></div>
      <input
        id="import-config"
        type="file"
        accept="application/json,.json"
        hidden
      />
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
